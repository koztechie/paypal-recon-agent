# Render blueprint (stage 115): the agent API as a web service from this repo.
# Health marker for stage 117 is /health (implemented in src/server.ts).
# Secrets (PAYPAL_CLIENT_ID/SECRET, LLM_API_KEY, BASE_URL) are NOT stored here —
# they are set in the Render dashboard (stage 116) with sync:false entries below.
services:
  - type: web
    name: paypal-recon-agent
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/koztechie/paypal-recon-agent
    branch: main
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    # H-4 data strategy: the free plan has an EPHEMERAL disk (data/recon.db dies on
    # every deploy/restart). Self-healing is built in: at boot the server restores
    # the COMMITTED sanitized snapshot seed/book-snapshot.json into an EMPTY book
    # (npm run book:export refreshes it before a commit). TRUE persistence upgrade
    # path (user, billing): Render dashboard -> service -> Disks -> Add Disk
    # (e.g. mount /var/data) + env DB_PATH=/var/data/recon.db, on a paid instance —
    # the code already honors DB_PATH (see ADR-020).
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      # Explicit (security C-2): the hosted demo runs REAL sandbox mode on purpose;
      # the abuse risk is closed by token-gating the mutating endpoints instead.
      - key: DRY_RUN
        value: 'false'
      - key: ACTION_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
