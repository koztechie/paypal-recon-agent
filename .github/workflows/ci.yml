name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Secret scan (tracked files)
        run: |
          # H-9: SECURITY.md promised a CI secrets grep that did not exist.
          if git grep -nIE "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,}" -- .; then
            echo "::error::possible secret found in tracked files"
            exit 1
          fi
          echo "no secret patterns in tracked files"

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Build (typecheck)
        run: npm run build

      - name: Test
        run: npm test

      # H-10: CI used to cover the backend only — the Next app (where the CRITICAL
      # advisory lived, C-4) never compiled here and no dependency audit ran anywhere.
      - name: Dependency audit (root)
        run: npm audit --audit-level=high

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web lint (eslint)
        working-directory: web
        run: npm run lint

      - name: Dependency audit (web)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Web build (next)
        working-directory: web
        run: npm run build
